services:
  - type: web
    name: brandos-web
    runtime: docker
    plan: standard
    region: oregon
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    startCommand: npm run start
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: HOSTNAME
        value: 0.0.0.0
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: AUTH_TRUST_HOST
        value: "true"

      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false

      - key: DATABASE_URL
        sync: false

      - key: PAGESPEED_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: CLOUDFLARE_RADAR_API_TOKEN
        sync: false

      - key: DISABLE_PSI
        value: "true"
