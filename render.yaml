services:
  - type: web
    name: brandos-web
    runtime: docker
    plan: standard
    region: oregon
    autoDeploy: true

    # Render will build from your repo's Dockerfile
    dockerfilePath: ./Dockerfile

    # Health check
    healthCheckPath: /api/audit

    # Optional: increase if your rendered audits need more headroom
    # Render instance sizing is controlled by `plan`
    # standard is a safer default than free for Playwright + Lighthouse

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: "3000"

      - key: HOSTNAME
        value: 0.0.0.0

      - key: NEXT_TELEMETRY_DISABLED
        value: "1"

      # If using NextAuth
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false

      # Database
      - key: DATABASE_URL
        fromDatabase:
          name: brandos-db
          property: connectionString

      # Optional APIs
      - key: PAGESPEED_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false

      # Turn off PSI while stabilizing rendered scans if needed
      - key: DISABLE_PSI
        value: "false"

databases:
  - name: brandos-db
    plan: basic-1gb
    region: oregon
    databaseName: brandos
    user: brandos
